# HAProxy for the ThingsBoard benchmark stack (HTTP only).
# Routing follows the official TB config (docker/haproxy/config/haproxy.cfg, release-4.3):
#   /api/v1/*  -> tb-http-transport   (device telemetry/attributes over HTTP)
#   /*         -> tb-core             (REST API: login, provisioning, queries; no web UI in this stack)
# Differences: no TLS/certbot, no per-IP connection or request-rate limits (they would throttle the
# load generator), and server-template + Docker DNS so any replica count is discovered automatically.

global
    maxconn 200000
    log stdout format raw local0 warning

defaults
    log global
    mode http
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout queue   60s
    timeout tunnel  1h
    # Servers start unresolved and are filled in from Docker DNS; missing replicas never block startup.
    default-server init-addr none resolvers docker resolve-prefer ipv4 check inter 2s fall 2 rise 2

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    5s
    hold other    5s
    hold refused  5s
    hold nx       5s
    hold timeout  5s
    hold obsolete 5s

frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
    no log

frontend http-in
    bind :8080
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port %[dst_port]
    acl transport_http path_beg /api/v1/
    use_backend tb-http-transport if transport_http
    default_backend tb-core

backend tb-http-transport
    balance roundrobin
    option tcp-check
    server-template http 16 tb-http-transport:8081

backend tb-core
    # The official config uses "balance source"; with a single load-generator IP that would pin all
    # traffic to one replica, so round-robin is used. REST auth is JWT (stateless), so no stickiness is needed.
    balance roundrobin
    option tcp-check
    server-template core 16 tb-core:8080
