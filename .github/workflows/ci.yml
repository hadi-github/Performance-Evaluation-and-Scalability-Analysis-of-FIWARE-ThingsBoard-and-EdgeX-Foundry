name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go build / vet / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./cmd/...
      - name: vet
        run: go vet ./internal/... ./cmd/... ./tests/...
      - name: gofmt (no diffs allowed)
        run: test -z "$(gofmt -l cmd internal)"
      - name: unit + local-fixture integration tests (no benchmark hosts contacted)
        run: go test ./internal/... ./cmd/... ./tests/... -count=1

  static:
    name: Shell + Python + evidence integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: |
          set -e
          for f in scripts/*.sh deploy/*/scripts/*.sh workloads/legacy/run.sh; do bash -n "$f"; done
          echo "bash -n OK"
      - name: shellcheck (advisory)
        continue-on-error: true
        run: shellcheck -f gcc scripts/*.sh deploy/*/scripts/*.sh workloads/legacy/run.sh
      - name: python syntax
        run: python3 -m py_compile scripts/*.py scripts/diag/*.py monitoring/grafana/*.py yaade/*.py
      - name: offline Python regressions
        run: |
          python3 -B -m unittest discover -s tests -p '*_test.py'
          python3 -B -m unittest discover -s tests/offline -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: offline adapter regressions
        run: node --test tests/offline/*.test.mjs
      - name: mocked ThingsBoard log capture regression
        run: bash tests/capture_thingsboard_file_logs_test.sh
      - name: preregistration archive integrity (bytes never change)
        run: bash scripts/check-preregistration.sh

      - name: vendored ThingsBoard D28 configuration (static, renders only)
        run: bash scripts/check-thingsboard-config.sh
      - name: evidence manifest (only meaningful when results/ is present locally — raw data is not in Git)
        run: |
          first_input=$(awk 'NF >= 2 {print $2; exit}' evidence/evidence-integrity.sha256)
          if [ -n "$first_input" ] && [ -f "$first_input" ]; then
            sha256sum -c evidence/evidence-integrity.sha256
          else
            echo "Raw evidence bundle not present — checksum verification skipped, not passed; run it on the evidence host. Versioned campaign plans are not raw evidence."
          fi

  deploy:
    name: Compose render + resource guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render and guard every platform stack at N=2
        run: |
          set -e
          for p in fiware thingsboard edgex; do
            echo "== deploy/$p"
            ( cd "deploy/$p" \
               && EDGEX_REPLICAS=2 TB_REPLICAS=2 FIWARE_REPLICAS=2 POOL_CPUSET=4-5 \
                 docker compose --env-file .env.example config --quiet \
               && EDGEX_REPLICAS=2 TB_REPLICAS=2 FIWARE_REPLICAS=2 POOL_CPUSET=4-5 \
                 docker compose --env-file .env.example config --format json \
                 | "$(pwd)/../../scripts/check-resources.sh" )
          done
      - name: render the experimental FIWARE history candidate
        run: |
          ( cd deploy/fiware/fiware-history-candidate \
            && docker compose --env-file ../.env.example config --quiet && echo ok )

      - name: render the monitoring stacks
        run: |
          # Render-only placeholder; never used to deploy a service or stored as a credential.
          GF_ADMIN_PASSWORD=ci-render-placeholder-not-a-deployed-password \
            docker compose --env-file monitoring/.env.example -f monitoring/compose.yaml config --quiet
          for p in fiware thingsboard edgex; do
            docker compose -f "monitoring/exporters/compose.$p.yaml" config --quiet
          done
