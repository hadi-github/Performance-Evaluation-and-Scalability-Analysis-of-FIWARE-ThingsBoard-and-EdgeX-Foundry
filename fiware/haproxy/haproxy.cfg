# HAProxy for the FIWARE benchmark stack. server-template + Docker DNS discovers any replica count.
# Also serves the internal aliases orion-lb (IoT Agent -> Orion) and iot-agent-lb (Orion -> IoT Agent, commands).

global
    maxconn 200000
    log stdout format raw local0 warning

defaults
    log global
    mode http
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout queue   60s
    default-server init-addr none resolvers docker resolve-prefer ipv4 check inter 2s fall 2 rise 2

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    5s
    hold other    5s
    hold refused  5s
    hold nx       5s
    hold timeout  5s
    hold obsolete 5s

frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
    no log

frontend orion-in
    bind :1026
    default_backend orion

backend orion
    balance roundrobin
    option httpchk GET /version
    http-check expect status 200
    server-template orion 16 orion:1026

frontend iota-north-in
    bind :4041
    default_backend iota-north

backend iota-north
    balance roundrobin
    option httpchk GET /iot/about
    http-check expect status 200
    server-template iotan 16 iot-agent:4041

frontend iota-http-in
    bind :7896
    default_backend iota-http

backend iota-http
    balance roundrobin
    # Health is judged on the north port: the southbound UL port has no health endpoint.
    option httpchk GET /iot/about
    http-check expect status 200
    server-template iotah 16 iot-agent:7896 port 4041
