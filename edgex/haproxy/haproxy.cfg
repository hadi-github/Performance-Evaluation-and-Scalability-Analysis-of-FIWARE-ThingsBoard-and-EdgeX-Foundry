# HAProxy for the EdgeX benchmark stack. server-template + Docker DNS discovers any replica count.
# Health check = EdgeX ping endpoint, so a replica that started but failed to bind is marked DOWN
# (this is exactly how the old "Up but dead" replicas would have been caught).

global
    maxconn 200000
    log stdout format raw local0 warning

defaults
    log global
    mode http
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout queue   60s
    default-server init-addr none resolvers docker resolve-prefer ipv4 check inter 2s fall 2 rise 2

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    5s
    hold other    5s
    hold refused  5s
    hold nx       5s
    hold timeout  5s
    hold obsolete 5s

frontend stats
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
    no log

frontend device-rest-in
    bind :59986
    default_backend device-rest

backend device-rest
    balance roundrobin
    option httpchk GET /api/v3/ping
    http-check expect status 200
    server-template rest 16 device-rest:59986

frontend core-data-in
    bind :59880
    default_backend core-data

backend core-data
    balance roundrobin
    option httpchk GET /api/v3/ping
    http-check expect status 200
    server-template data 16 core-data:59880

frontend core-metadata-in
    bind :59881
    default_backend core-metadata

backend core-metadata
    balance roundrobin
    option httpchk GET /api/v3/ping
    http-check expect status 200
    server-template meta 2 core-metadata:59881
