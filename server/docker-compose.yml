version: '3.8'

networks:
  tb_network:
    external: true 
    name: tb-network

services:
  thingsboard-1:
    image: docker.arvancloud.ir/thingsboard/tb-node:4.2.0
    container_name: tb-node-1
    hostname: tb-node-1
    restart: unless-stopped
    # No internal dependencies - using external PostgreSQL
    ports:
       - "${TB1_PORT}:9090"    # Web UI (different port to avoid conflicts)
    #  - "1884:1883"    # MQTT (different port to avoid conflicts)
    #  - "8884:8883"    # MQTT SSL
    #  - "7071:7070"    # Edge RPC
    #  - "5689-5694:5683-5688/udp"  # CoAP (different range)
    # Use host network for better external database connectivity
    networks:
      - tb_network
    environment:
      # Service Configuration
      TB_SERVICE_ID: tb-node-1
      TB_SERVICE_TYPE: monolith
      
      # Database Configuration (pointing to external postgres)
      SPRING_DATASOURCE_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB}
      SPRING_DATASOURCE_USERNAME: ${PG_USER}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASS}
      SPRING_DATASOURCE_MAXIMUM_POOL_SIZE: 5
      
      # ThingsBoard Configuration
      TB_QUEUE_TYPE: in-memory
      
      # Cache Configuration
      CACHE_TYPE: caffeine
      
      # Demo data loading
      #LOAD_DEMO: 'true'
      #INSTALL_TB: 'true'
      
      # Memory Configuration (higher for all-in-one)
      JAVA_OPTS: >-
        -Xmx1536m
        -Xms768m
        -Dplatform=dmp
        -Dinstall.data_dir=/tmp
      
      # Security Configuration
      TB_HOST: localhost
      HTTP_BIND_PORT: 9090
      HTTPS_BIND_PORT: 8443
      
      # Logging
      SPRING_JPA_SHOW_SQL: 'false'
    volumes:
      - tb-allinone-data:/data
      - tb-allinone-logs:/var/log/thingsboard
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/login || exit 1"]
      interval: 45s
      timeout: 15s
      retries: 10
      start_period: 420s  # Allow more time for initialization
