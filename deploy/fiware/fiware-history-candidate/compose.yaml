# FIWARE history candidate (isolated) — Orion 4.5.0 + QuantumLeap 1.0.0 + TimescaleDB (PG 13 + ext 2.3.0)
#
# Session auto-20261027. This is the D31-selected path A (QuantumLeap + TimescaleDB) as an ISOLATED candidate:
#   - its own Compose project (`fiwhc`, from `name:` below), fresh volumes — never the live `fiware` project's
#     data, and never the prior benchmark volumes.
#   - synchronous QL mode (the default: no WQ_OFFLOAD_WORK, no Redis service), USE_GEOCODING explicitly false:
#     geocoding is active only if the flag is set AND a Redis host exists (src/geocoding/factory.py, QL 1.0.0);
#     with this file the notify path needs no Redis and makes no external calls.
#   - backend selection via QL_DEFAULT_DB (src/translators/factory.py QL 1.0.0: `guest/env var beats config file`).
#   - bootstrap: the shipped `timescale-container/quantumleap-db-setup.py` (tags 1.0.0), invoked with its
#     documented CLI flags (verified against the pinned image: `--pg-host`, `--ql-db-name/--ql-db-user/--ql-db-pass`).
#
# Resource placement (CANDIDATE allocations, to be measured — B4 owner decision later; nothing adopted here):
#   orion     cpuset POOL_CPUSET (pool core) mem 512m   — identical to the adopted baseline layout
#   mongo     cpuset INFRA_CPUSET (2-3)     mem 2g     — identical to the adopted baseline layout
#   timescale cpuset INFRA_CPUSET (2-3)     mem 1536m  — CANDIDATE allocation (new service)
#   quantumleap cpuset INFRA_CPUSET (2-3)   mem 512m   — CANDIDATE allocation (new service)
# No extra cores are borrowed; the pool tier keeps its adopted core; LB core stays free (haproxy is not part of
# the pair-test candidate; the eventual full stack adds it unchanged).
#
# This file is a full explicit compose (not an overlay of deploy/fiware/compose.yaml) so the Compose project, volumes and
# published ports remain distinct from anything else. Orion is published on 11026 (host only); QL 8668.

name: fiwhc

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  mongo:
    image: mongo:${MONGO_VERSION:-8.0}
    restart: unless-stopped
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: ${MONGO_MEM:-2g}
    memswap_limit: ${MONGO_MEM:-2g}
    command: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "${MONGO_WT_CACHE_GB:-1}"]
    volumes:
      - fwc-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  mongo-init:
    image: mongo:${MONGO_VERSION:-8.0}
    restart: "no"
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      FIWARE_SERVICE: ${FIWARE_SERVICE:-openiot}
    volumes:
      - ./mongo/init-indexes.js:/init-indexes.js:ro
    command: ["mongosh", "--quiet", "mongodb://mongo:27017", "/init-indexes.js"]
    depends_on:
      mongo:
        condition: service_healthy
    logging: *logging

  orion:
    image: fiware/orion:${ORION_VERSION:-4.5.0}
    restart: unless-stopped
    cpuset: "${POOL_CPUSET:-4}"
    mem_limit: ${ORION_MEM:-512m}
    memswap_limit: ${ORION_MEM:-512m}
    command:
      - -dbURI
      - mongodb://mongo:27017
      - -dbPoolSize
      - "${ORION_DB_POOL_SIZE:-10}"
      - -reqMutexPolicy
      - none
      - -reqPoolSize
      - "${ORION_REQ_POOL_SIZE:-0}"
      - -logLevel
      - ${ORION_LOG_LEVEL:-WARN}
    ulimits:
      nofile: 65536
      nproc: 32000
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "${ORION_PORT:-11026}:1026"
    logging: *logging

  timescale:
    image: timescale/timescaledb-postgis:${TIMESCALE_VERSION:-2.3.0-pg13}
    restart: unless-stopped
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: ${TIMESCALE_MEM:-1536m}
    memswap_limit: ${TIMESCALE_MEM:-1536m}
    environment:
      - POSTGRES_PASSWORD=ql
    volumes:
      - fwc-ts-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  ql-db-init:
    # One-shot bootstrap, behind a profile: the SQL it runs needs `psql`, which the pinned QL 1.0.0 image does not
    # ship (it shells out to psql; the image has python but not the psql client). Documented run:
    #   scripts/history-ids.sh fiware bootstrap | or the exact SQL with `docker exec fiwhc-timescale-1 psql`.
    # The SQL content is the pinned image's own CreateDb template, executed word-for-word (see docs). After a
    # successful manual bootstrap this service is never needed again for the candidate; keep the profile so an
    # accidental `docker compose up -d` does not re-run it.
    image: orchestracities/quantumleap:${QL_VERSION:-1.0.0}
    profiles: [bootstrap]
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: 512m
    memswap_limit: 512m
    # The image ENTRYPOINT is ["python","app.py"] — it must be replaced here; see the file header comment.
    entrypoint:
      - python
      - /src/ngsi-timeseries-api/timescale-container/quantumleap-db-setup.py
      - --pg-host
      - timescale
      - --pg-port
      - "5432"
      - --pg-username
      - postgres
      - --pg-pass
      - ql
      - --ql-db-name
      - quantumleap
      - --ql-db-user
      - ql
      - --ql-db-pass
      - ql
    depends_on:
      timescale:
        condition: service_healthy
    logging: *logging

  quantumleap:
    image: orchestracities/quantumleap:${QL_VERSION:-1.0.0}
    restart: unless-stopped
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: ${QL_MEM:-512m}
    memswap_limit: ${QL_MEM:-512m}
    environment:
      - QL_DEFAULT_DB=timescale
      - POSTGRES_HOST=timescale
      - POSTGRES_PORT=5432
      - POSTGRES_DB_NAME=quantumleap
      - POSTGRES_DB_USER=ql
      - POSTGRES_DB_PASS=ql
      - LOGLEVEL=INFO
      - USE_GEOCODING=false
    depends_on:
      timescale:
        condition: service_healthy
    ports:
      - "${QL_PORT:-8668}:8668"
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8668/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

volumes:
  fwc-mongo-data:
  fwc-ts-data:
