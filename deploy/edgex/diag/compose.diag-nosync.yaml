# DIAG ONLY, DURABILITY WEAKENED (docs/methodology/hypotheses.md H-E1): synchronous_commit=off, on top of the pgstat override.
# Use: COMPOSE_FILE=compose.yaml:diag/compose.diag-pgstat.yaml:diag/compose.diag-nosync.yaml, only for DIAG-*-nosync
# runs, labelled in their manifests. Must never reach compose.yaml or .env.example (D25).
# Source: PostgreSQL 16 docs, 20.5.1 Settings, synchronous_commit; 30.4 Asynchronous Commit.
services:
  database:
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - log_statement=none
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - synchronous_commit=off
