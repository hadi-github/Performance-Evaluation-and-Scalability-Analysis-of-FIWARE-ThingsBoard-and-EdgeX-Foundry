# EdgeX Foundry 4.0 (Odesa LTS) — scalable ingestion stack for benchmarking
#
# Derived from the official edgex-compose v4.0.2 (docker-compose-no-secty.yml + compose-builder/add-nats-messagebus.yml).
# Ingestion path under test:  client --HTTP--> device-rest --NATS--> core-data --> PostgreSQL
#
# Changes vs. official (and why):
#   - Message bus = core NATS with a queue group on core-data (config/core-data.yaml). This is EdgeX's built-in
#     competing-consumer mechanism; with the default MQTT bus every core-data replica would persist every event
#     (and replicas sharing the MQTT ClientId "core-data" would kick each other off the broker).
#   - Official images are compiled WITHOUT NATS ("NATS is only available if built local dev images", compose-builder
#     Makefile). The 4 services that use the bus are therefore built from the official v4.0.2 source with the official
#     build flag ADD_BUILD_TAGS=include_nats_messaging. No source changes.
#   - core-data and device-rest have deploy.replicas (default 1); all ports are published by HAProxy only, on 0.0.0.0.
#   - Dropped from the benchmark path: device-virtual (generates background events), eKuiper + app-rules-engine,
#     support-notifications/scheduler, core-command. UI is optional (profile "ui").
#   - EDGEX_OVERWRITE_CONFIG=true on every service: env + mounted files are re-pushed to core-keeper on every start,
#     so the running config always equals what is in this repo (no stale config surviving in the keeper DB).
#   - Replicated services bind 0.0.0.0 (ALL_SERVICES_SERVICE_SERVERBINDADDR) and register with SERVICE_HOST = an alias
#     owned by HAProxy, so anything resolving them through the registry also goes through the load balancer.
#   - Fixed resources: every container is pinned (cpuset) and has a hard memory limit without swap. See the README,
#     "Resource layout". One platform instance = one core-data + one device-rest replica; all replicas share the
#     platform pool POOL_CPUSET (one core per instance, set by make).
#
# Scale:  make up N=4     (sets EDGEX_REPLICAS=4 and POOL_CPUSET=4-7)

name: edgex

x-edgex-service: &edgex-service
  restart: unless-stopped
  read_only: true
  user: "2002:2001"
  security_opt:
    - no-new-privileges:true
  networks: [edgex-network]

x-edgex-env: &edgex-env
  EDGEX_SECURITY_SECRET_STORE: "false"
  EDGEX_OVERWRITE_CONFIG: "true"
  WRITABLE_LOGLEVEL: ${EDGEX_LOG_LEVEL:-WARN}

x-nats-build-args: &nats-build-args
  # VERSION=...: the Makefiles read the version from a VERSION file that only exists in EdgeX CI, so a build from the
  # git tag reports 0.0.0 and core-keeper then refuses to start against its own 4.0.x schema record. The Dockerfiles
  # run "make -e ADD_BUILD_TAGS=$ADD_BUILD_TAGS ..." unquoted, so the extra word becomes a make variable override.
  ADD_BUILD_TAGS: "include_nats_messaging VERSION=${EDGEX_VERSION:-4.0.2}"
  # Go builder image (edgex-go calls the arg BUILDER_BASE, device-rest-go calls it BASE). Override GO_BUILDER_BASE
  # with an image that sets GOPROXY where proxy.golang.org is unreachable.
  BUILDER_BASE: ${GO_BUILDER_BASE:-golang:1.25-alpine3.22}
  BASE: ${GO_BUILDER_BASE:-golang:1.25-alpine3.22}

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- infrastructure (not replicated)
  database:
    image: postgres:${EDGEX_POSTGRES_VERSION:-16.3-alpine}
    restart: unless-stopped
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: ${POSTGRES_MEM:-1536m}
    memswap_limit: ${POSTGRES_MEM:-1536m}
    shm_size: 256m
    environment:
      POSTGRES_DB: edgex_db
      # Must stay 'postgres': EdgeX's insecure-secrets default (Writable.InsecureSecrets.DB) expects it.
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - log_statement=none
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      edgex-network:
        aliases: [edgex-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edgex_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  nats:
    image: nats:${NATS_VERSION:-2.12.9-alpine}
    restart: unless-stopped
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: ${NATS_MEM:-256m}
    memswap_limit: ${NATS_MEM:-256m}
    # Core NATS (no JetStream): at-most-once delivery, the same guarantee as EdgeX's default MQTT bus at QoS 0.
    # -m 8222 exposes /healthz and /varz for monitoring.
    command: ["-m", "8222"]
    networks:
      edgex-network:
        aliases: [edgex-nats-server]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  core-keeper:
    <<: *edgex-service
    image: edgex-nats/core-keeper:${EDGEX_VERSION:-4.0.2}
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: ${CORE_KEEPER_MEM:-256m}
    memswap_limit: ${CORE_KEEPER_MEM:-256m}
    build:
      context: https://github.com/edgexfoundry/edgex-go.git#v${EDGEX_VERSION:-4.0.2}
      dockerfile: cmd/core-keeper/Dockerfile
      args: *nats-build-args
    environment:
      <<: *edgex-env
      SERVICE_HOST: edgex-core-keeper
      DATABASE_HOST: edgex-postgres
      MESSAGEBUS_TYPE: nats-core
      MESSAGEBUS_PROTOCOL: tcp
      MESSAGEBUS_HOST: edgex-nats-server
      MESSAGEBUS_PORT: "4222"
      MESSAGEBUS_AUTHMODE: none
      MESSAGEBUS_SECRETNAME: ""
    networks:
      edgex-network:
        aliases: [edgex-core-keeper]
    depends_on:
      database:
        condition: service_healthy
      nats:
        condition: service_healthy
    logging: *logging

  core-common-config-bootstrapper:
    # Pushes the common config into core-keeper and exits; never touches the bus, so the official image is fine.
    <<: *edgex-service
    image: edgexfoundry/core-common-config-bootstrapper:${EDGEX_VERSION:-4.0.2}
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: 128m
    memswap_limit: 128m
    restart: "no"
    command: ["/core-common-config-bootstrapper", "--registry", "-cp=keeper.http://edgex-core-keeper:59890"]
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      EDGEX_OVERWRITE_CONFIG: "true"
      ALL_SERVICES_REGISTRY_HOST: edgex-core-keeper
      ALL_SERVICES_DATABASE_HOST: edgex-postgres
      ALL_SERVICES_MESSAGEBUS_TYPE: nats-core
      ALL_SERVICES_MESSAGEBUS_PROTOCOL: tcp
      ALL_SERVICES_MESSAGEBUS_HOST: edgex-nats-server
      ALL_SERVICES_MESSAGEBUS_PORT: "4222"
      ALL_SERVICES_MESSAGEBUS_AUTHMODE: none
      # Bind all interfaces: replicas share one Service.Host value, so binding to Host would fail on all but one.
      ALL_SERVICES_SERVICE_SERVERBINDADDR: 0.0.0.0
      APP_SERVICES_CLIENTS_CORE_METADATA_HOST: edgex-core-metadata
      DEVICE_SERVICES_CLIENTS_CORE_METADATA_HOST: edgex-core-metadata
    depends_on:
      core-keeper:
        condition: service_started
    logging: *logging

  core-metadata:
    # Provisioning path only (profiles/devices); not on the per-message hot path, so not replicated.
    <<: *edgex-service
    image: edgex-nats/core-metadata:${EDGEX_VERSION:-4.0.2}
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: ${CORE_METADATA_MEM:-256m}
    memswap_limit: ${CORE_METADATA_MEM:-256m}
    build:
      context: https://github.com/edgexfoundry/edgex-go.git#v${EDGEX_VERSION:-4.0.2}
      dockerfile: cmd/core-metadata/Dockerfile
      args: *nats-build-args
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890"]
    environment:
      <<: *edgex-env
      SERVICE_HOST: edgex-core-metadata
    networks:
      edgex-network:
        aliases: [edgex-core-metadata]
    depends_on:
      core-common-config-bootstrapper:
        condition: service_started
      database:
        condition: service_healthy
    logging: *logging

  # ---------------------------------------------------------------- replicated tiers
  core-data:
    <<: *edgex-service
    image: edgex-nats/core-data:${EDGEX_VERSION:-4.0.2}
    cpuset: "${POOL_CPUSET:-4}"
    mem_limit: ${EDGEX_CORE_DATA_MEM:-512m}
    memswap_limit: ${EDGEX_CORE_DATA_MEM:-512m}
    build:
      context: https://github.com/edgexfoundry/edgex-go.git#v${EDGEX_VERSION:-4.0.2}
      dockerfile: cmd/core-data/Dockerfile
      args: *nats-build-args
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890"]
    environment:
      <<: *edgex-env
      SERVICE_HOST: edgex-core-data          # alias owned by HAProxy
      DATABASE_MAXCONNS: ${EDGEX_CORE_DATA_DB_MAXCONNS:-4}   # per replica; EdgeX default is 4
      WRITABLE_PERSISTDATA: "true"
    volumes:
      - ./config/core-data.yaml:/res/configuration.yaml:ro
    depends_on:
      core-common-config-bootstrapper:
        condition: service_started
      database:
        condition: service_healthy
    deploy:
      replicas: ${EDGEX_REPLICAS:-1}
    logging: *logging

  device-rest:
    # Stateless HTTP ingress. Replicas do NOT use a queue group for system events, so every replica receives
    # device add/update events and keeps an identical device cache.
    <<: *edgex-service
    image: edgex-nats/device-rest:${EDGEX_DEVICE_REST_VERSION:-4.0.2}
    cpuset: "${POOL_CPUSET:-4}"
    mem_limit: ${EDGEX_DEVICE_REST_MEM:-512m}
    memswap_limit: ${EDGEX_DEVICE_REST_MEM:-512m}
    build:
      context: https://github.com/edgexfoundry/device-rest-go.git#v${EDGEX_DEVICE_REST_VERSION:-4.0.2}
      dockerfile: Dockerfile
      args: 
        <<: *nats-build-args
        ADD_BUILD_TAGS: "include_nats_messaging VERSION=${EDGEX_DEVICE_REST_VERSION:-4.0.2}"
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890"]
    environment:
      <<: *edgex-env
      SERVICE_HOST: edgex-device-rest        # alias owned by HAProxy
    depends_on:
      core-metadata:
        condition: service_started
      core-data:
        condition: service_started
    deploy:
      replicas: ${EDGEX_REPLICAS:-1}
    logging: *logging

  # Outbound delivery for the measurement (profile "export"): every event on the bus is exported over HTTP to the
  # sink (docs/methodology/exploratory-capacity.md). It is EdgeX processing on the outbound path, so it runs in the application
  # pool, the counterpart of ThingsBoard's rule-engine REST call. One replica (no queue group: each replica would
  # export every event). Official image is built without NATS, so it is built like the other bus services.
  app-http-export:
    profiles: ["export"]
    <<: *edgex-service
    image: edgex-nats/app-service-configurable:${EDGEX_VERSION:-4.0.2}
    cpuset: "${POOL_CPUSET:-4}"
    mem_limit: ${EDGEX_APP_EXPORT_MEM:-512m}
    memswap_limit: ${EDGEX_APP_EXPORT_MEM:-512m}
    build:
      context: https://github.com/edgexfoundry/app-service-configurable.git#v${EDGEX_VERSION:-4.0.2}
      dockerfile: Dockerfile
      args:
        <<: *nats-build-args
        ADD_BUILD_TAGS: "include_nats_messaging VERSION=${EDGEX_VERSION:-4.0.2}"
    environment:
      <<: *edgex-env
      EDGEX_PROFILE: http-export
      SERVICE_HOST: edgex-app-http-export
      WRITABLE_PIPELINE_EXECUTIONORDER: HTTPExport
      WRITABLE_PIPELINE_FUNCTIONS_HTTPEXPORT_PARAMETERS_URL: ${SINK_URL:-http://87.107.191.32:18090}/edgex
    depends_on:
      core-data:
        condition: service_started
    logging: *logging

  ui:
    profiles: ["ui"]
    <<: *edgex-service
    image: edgexfoundry/edgex-ui:${EDGEX_VERSION:-4.0.2}
    cpuset: "${INFRA_CPUSET:-2-3}"
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: edgex-ui-go
    ports:
      - "${BIND_IP:-0.0.0.0}:4000:4000"
    logging: *logging

  # ---------------------------------------------------------------- single entry point (always present, also at N=1)
  haproxy:
    image: haproxy:${HAPROXY_VERSION:-3.2-alpine}
    restart: unless-stopped
    cpuset: "${LB_CPUSET:-1}"
    mem_limit: ${LB_MEM:-256m}
    memswap_limit: ${LB_MEM:-256m}
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      edgex-network:
        aliases: [edgex-core-data, edgex-device-rest]
    ports:
      - "${BIND_IP:-0.0.0.0}:${EDGEX_DEVICE_REST_PORT:-59986}:59986"  # device-rest (telemetry ingress)
      - "${BIND_IP:-0.0.0.0}:${EDGEX_CORE_DATA_PORT:-59880}:59880"    # core-data API (queries/counts)
      - "${BIND_IP:-0.0.0.0}:${EDGEX_CORE_METADATA_PORT:-59881}:59881" # core-metadata API (provisioning)
      - "${BIND_IP:-0.0.0.0}:${LB_STATS_PORT:-8404}:8404"
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65000"
    ulimits:
      nofile: 500000
    logging: *logging

networks:
  edgex-network:
    driver: bridge

volumes:
  db-data:
