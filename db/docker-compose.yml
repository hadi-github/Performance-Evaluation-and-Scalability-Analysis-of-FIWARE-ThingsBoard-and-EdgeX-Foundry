networks:
  postgres-net:
    driver: bridge

volumes:
  postgres-primary-data:
  postgres-replica1-data:
  postgres-replica2-data:

services:
  # PostgreSQL Primary Database
  postgres-primary:
    image: postgres:15
    container_name: postgres-primary
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator123
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./postgresql-primary.conf:/etc/postgresql/postgresql.conf
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    ports:
      - "5432:5432"
    networks:
      - postgres-net
    command: >
      bash -c "
        chmod +x /docker-entrypoint-initdb.d/init-primary.sh &&
        docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
      "

  # PostgreSQL Replica 1
  postgres-replica1:
    image: postgres:15
    container_name: postgres-replica1
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator123
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_PRIMARY_PORT: 5432
    volumes:
      - postgres-replica1-data:/var/lib/postgresql/data
      - ./postgresql-replica.conf:/etc/postgresql/postgresql.conf
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh
    ports:
      - "5433:5432"
    networks:
      - postgres-net
    depends_on:
      - postgres-primary
    command: >
      bash -c "
        chmod +x /docker-entrypoint-initdb.d/init-replica.sh &&
        /docker-entrypoint-initdb.d/init-replica.sh &&
        docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
      "

  # PostgreSQL Replica 2
  postgres-replica2:
    image: postgres:15
    container_name: postgres-replica2
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator123
      POSTGRES_PRIMARY_HOST: postgres-primary
      POSTGRES_PRIMARY_PORT: 5432
    volumes:
      - postgres-replica2-data:/var/lib/postgresql/data
      - ./postgresql-replica.conf:/etc/postgresql/postgresql.conf
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh
    ports:
      - "5434:5432"
    networks:
      - postgres-net
    depends_on:
      - postgres-primary
    command: >
      bash -c "
        chmod +x /docker-entrypoint-initdb.d/init-replica.sh &&
        /docker-entrypoint-initdb.d/init-replica.sh &&
        docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
      "

# PgPool-II Connection Pooler and Load Balancer
  pgpool:
    image: pgpool/pgpool
    container_name: pgpool
    environment:
      PGPOOL_PARAMS_BACKEND_HOSTNAME0: postgres-primary
      PGPOOL_PARAMS_BACKEND_PORT0: 5432
      PGPOOL_PARAMS_BACKEND_WEIGHT0: 1
      PGPOOL_PARAMS_BACKEND_DATA_DIRECTORY0: /var/lib/postgresql/data
      PGPOOL_PARAMS_BACKEND_HOSTNAME1: postgres-replica1
      PGPOOL_PARAMS_BACKEND_PORT1: 5432
      PGPOOL_PARAMS_BACKEND_WEIGHT1: 1
      PGPOOL_PARAMS_BACKEND_DATA_DIRECTORY1: /var/lib/postgresql/data
      PGPOOL_PARAMS_BACKEND_HOSTNAME2: postgres-replica2
      PGPOOL_PARAMS_BACKEND_PORT2: 5432
      PGPOOL_PARAMS_BACKEND_WEIGHT2: 1
      PGPOOL_PARAMS_BACKEND_DATA_DIRECTORY2: /var/lib/postgresql/data
      PGPOOL_PARAMS_LISTEN_ADDRESSES: '*'
      PGPOOL_PARAMS_PORT: 9999
      PGPOOL_PARAMS_ENABLE_POOL_HBA: off
      PGPOOL_PARAMS_POOL_PASSWD: pool_passwd
      PGPOOL_PARAMS_AUTHENTICATION_TIMEOUT: 60
      PGPOOL_PARAMS_LOAD_BALANCE_MODE: on
      PGPOOL_PARAMS_MASTER_SLAVE_MODE: on
      PGPOOL_PARAMS_MASTER_SLAVE_SUB_MODE: stream
      PGPOOL_PARAMS_SR_CHECK_USER: postgres
      PGPOOL_PARAMS_SR_CHECK_PASSWORD: postgres123
      PGPOOL_PARAMS_HEALTH_CHECK_PERIOD: 30
      PGPOOL_PARAMS_HEALTH_CHECK_USER: postgres
      PGPOOL_PARAMS_HEALTH_CHECK_PASSWORD: postgres123
      PGPOOL_PARAMS_HEALTH_CHECK_DATABASE: thingsboard
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: postgres123
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - ./pool_hba.conf:/etc/pgpool-II/pool_hba.conf
    ports:
      - "8080:9999"  # PgPool connection port
      - "9898:9898"  # PCP port for administration
    networks:
      - postgres-net
    depends_on:
      - postgres-primary
      - postgres-replica1
      - postgres-replica2


