listen_addresses = '*'
port = 9999
pcp_listen_addresses = '*'
pcp_port = 9898

# Backend settings
backend_hostname0 = 'postgres-primary'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/var/lib/postgresql/data'

backend_hostname1 = 'postgres-replica1'
backend_port1 = 5432
backend_weight1 = 1
backend_data_directory1 = '/var/lib/postgresql/data'

backend_hostname2 = 'postgres-replica2'
backend_port2 = 5432
backend_weight2 = 1
backend_data_directory2 = '/var/lib/postgresql/data'

# Authentication
enable_pool_hba = on
pool_passwd = 'pool_passwd'

# Connection pooling
connection_cache = on
max_pool = 15
child_max_connections = 50
client_idle_limit = 0

# Load balancing
load_balance_mode = on
statement_level_load_balance = on

# Master/Slave mode
master_slave_mode = off
master_slave_sub_mode = 'stream'

# Health check
health_check_period = 30
health_check_timeout = 20
health_check_user = 'postgres'
health_check_password = 'postgres123'
health_check_database = 'myapp'

# Failover
failover_command = ''
follow_master_command = ''

# Logging
log_destination = 'stderr'
log_statement = on
log_per_node_statement = on
log_connections = on

